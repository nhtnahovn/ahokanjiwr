<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Writing Practice - Demo</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .demo-header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }
        .demo-header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.5rem;
        }
        .demo-header p {
            margin: 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .kwp-block-placeholder {
            text-align: center;
            padding: 3rem;
            background: #f8f9fa;
            border: 2px dashed #ddd;
            border-radius: 8px;
            margin: 2rem 0;
        }
        .kwp-block-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .kwp-block-placeholder h3 {
            margin: 0.5rem 0;
            color: #333;
        }
        .kwp-block-placeholder p {
            margin: 0.5rem 0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="demo-header">
        <h1>✍️ Kanji Writing Practice</h1>
        <p>Practice writing Kanji characters with an interactive canvas</p>
    </div>

    <div class="kwp-container">
        <div class="kwp-input-section">
            <label for="kwp-kanji-input" class="kwp-label">
                Enter a Kanji character:
            </label>
            <input 
                type="text" 
                id="kwp-kanji-input" 
                class="kwp-kanji-input" 
                maxlength="1"
                placeholder="漢"
            />
        </div>

        <div class="kwp-canvas-wrapper" style="display: none;">
            <div class="kwp-controls">
                <div class="kwp-control-group">
                    <button class="kwp-btn kwp-fullscreen-btn" title="Fullscreen">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                        </svg>
                    </button>
                </div>

                <div class="kwp-control-group">
                    <label class="kwp-control-label">Watermark:</label>
                    <button class="kwp-btn kwp-toggle-watermark active" title="Toggle Watermark">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>

                <div class="kwp-control-group">
                    <label class="kwp-control-label">Grid Opacity:</label>
                    <input type="range" class="kwp-slider kwp-grid-opacity" min="0" max="100" value="37" />
                    <span class="kwp-value">37%</span>
                </div>

                <div class="kwp-control-group">
                    <label class="kwp-control-label">Watermark Opacity:</label>
                    <input type="range" class="kwp-slider kwp-watermark-opacity" min="0" max="100" value="45" />
                    <span class="kwp-value">45%</span>
                </div>

                <div class="kwp-control-group">
                    <label class="kwp-control-label">Pen Color:</label>
                    <input type="color" class="kwp-color-picker" value="#000000" />
                </div>

                <div class="kwp-control-group">
                    <label class="kwp-control-label">Pen Size:</label>
                    <input type="range" class="kwp-slider kwp-pen-size" min="1" max="20" value="3" />
                    <span class="kwp-value">3</span>
                </div>

                <div class="kwp-control-group">
                    <button class="kwp-btn kwp-undo-btn" title="Undo">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 7v6h6"/>
                            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
                        </svg>
                    </button>
                    <button class="kwp-btn kwp-clear-btn" title="Clear">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="kwp-canvas-container">
                <canvas class="kwp-grid-canvas"></canvas>
                <canvas class="kwp-watermark-canvas"></canvas>
                <canvas class="kwp-drawing-canvas"></canvas>
            </div>
        </div>
    </div>

    <script src="assets/js/kanji-practice.js"></script>
    <script>
        // Initialize without jQuery
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.kwp-container').forEach(function(container) {
                new KanjiPractice(container);
            });
        });
    </script>
</body>
</html>
